<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LegacyVault</title>

  <!-- Font và Icon -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet" />

  <!-- Dùng thẳng Tailwind qua CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          borderRadius: { lg: '0.875rem', xl: '1.125rem', '2xl': '1.5rem' },
          boxShadow: { sm: '0 1px 2px rgba(11,16,32,0.06), 0 8px 24px -12px rgba(11,16,32,0.18)' },
          colors: {
            "primary": "#0b1020",
            "on-primary": "#ffffff",
            "primary-container": "#1a2140",
            "secondary": "#3d5ae0",
            "on-secondary": "#ffffff",
            "background": "#e2e6f1",
            "on-surface": "#0b1020",
            "on-surface-variant": "#4a5272",
            "surface-container-lowest": "#f3f5fa",
            "surface-container-low": "#eaedf7",
            "surface-container": "#e0e5f4",
            "surface-container-high": "#d6dcee",
            "outline": "#6b7390",
            "outline-variant": "#c3cae0",
            "secondary-fixed": "#dbe2ff",
            "on-secondary-fixed": "#0f1f6b",
            "tertiary-fixed": "#89f5e7",
            "tertiary-container": "#004942",
            "primary-fixed": "#d6dcf5",
            "on-primary-fixed": "#0b1020",
            "error": "#ba1a1a",
            "on-error": "#ffffff",
            "error-container": "#ffdad6",
            "on-error-container": "#93000a",
            "success": "#1b7a3d",
            "on-success": "#ffffff",
            "success-container": "#c8f0d3",
            "on-success-container": "#00210d",
            "warning": "#8a5a00",
            "on-warning": "#ffffff",
            "warning-container": "#ffe9b8",
            "on-warning-container": "#2b1b00"
          },
          spacing: {
            "margin": "1.25rem",
            "space-xs": "0.375rem",
            "space-xl": "3rem",
            "gutter-lg": "2rem",
            "margin-lg": "4rem",
            "space-lg": "2rem",
            "space-md": "1.25rem",
            "gutter": "1.5rem",
            "margin-md": "2.5rem",
            "space-sm": "0.75rem"
          },
          fontFamily: {
            "body-md": ["Atkinson Hyperlegible Next"],
            "body-xl": ["Atkinson Hyperlegible Next"],
            "body-lg": ["Atkinson Hyperlegible Next"],
            "label-md": ["Atkinson Hyperlegible Next"],
            "label-sm": ["Atkinson Hyperlegible Next"],
            "label-lg": ["Atkinson Hyperlegible Next"],
            "headline-sm": ["Plus Jakarta Sans"],
            "headline-md": ["Plus Jakarta Sans"],
            "headline-lg": ["Plus Jakarta Sans"],
            "title-lg": ["Plus Jakarta Sans"]
          },
          fontSize: {
            "headline-sm": ["22px", { "lineHeight": "30px", "fontWeight": "600" }],
            "body-md": ["16px", { "lineHeight": "26px", "fontWeight": "400" }],
            "body-xl": ["20px", { "lineHeight": "32px", "fontWeight": "400" }],
            "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
            "label-md": ["16px", { "lineHeight": "22px", "fontWeight": "600" }],
            "headline-md": ["26px", { "lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
            "label-sm": ["14px", { "lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "600" }],
            "label-lg": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
            "title-lg": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
            "headline-lg": ["36px", { "lineHeight": "46px", "letterSpacing": "-0.015em", "fontWeight": "600" }]
          }
        }
      }
    }
  </script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
