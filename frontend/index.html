<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LegacyVault Dashboard</title>

  <!-- Font và Icon -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet" />

  <!-- Dùng thẳng Tailwind qua CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "primary": "#00236f",
            "on-primary": "#ffffff",
            "primary-container": "#1e3a8a",
            "secondary": "#006398",
            "on-secondary": "#ffffff",
            "background": "#faf8ff",
            "on-surface": "#131b2e",
            "on-surface-variant": "#444651",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f2f3ff",
            "surface-container": "#eaedff",
            "surface-container-high": "#e2e7ff",
            "outline": "#757682",
            "outline-variant": "#c5c5d3",
            "secondary-fixed": "#cce5ff",
            "on-secondary-fixed": "#001d31",
            "tertiary-fixed": "#89f5e7",
            "tertiary-container": "#004942"
          },
          spacing: {
            "margin": "1.25rem",
            "space-xs": "0.375rem",
            "space-xl": "3rem",
            "gutter-lg": "2rem",
            "margin-lg": "4rem",
            "space-lg": "2rem",
            "space-md": "1.25rem",
            "gutter": "1.5rem",
            "margin-md": "2.5rem",
            "space-sm": "0.75rem"
          },
          fontFamily: {
            "body-md": ["Atkinson Hyperlegible Next"],
            "body-xl": ["Atkinson Hyperlegible Next"],
            "body-lg": ["Atkinson Hyperlegible Next"],
            "label-md": ["Atkinson Hyperlegible Next"],
            "label-sm": ["Atkinson Hyperlegible Next"],
            "label-lg": ["Atkinson Hyperlegible Next"],
            "headline-sm": ["Plus Jakarta Sans"],
            "headline-md": ["Plus Jakarta Sans"],
            "headline-lg": ["Plus Jakarta Sans"]
          },
          fontSize: {
            "headline-sm": ["22px", { "lineHeight": "30px", "fontWeight": "600" }],
            "body-md": ["16px", { "lineHeight": "26px", "fontWeight": "400" }],
            "body-xl": ["20px", { "lineHeight": "32px", "fontWeight": "400" }],
            "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
            "label-md": ["16px", { "lineHeight": "22px", "fontWeight": "600" }],
            "headline-md": ["26px", { "lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
            "label-sm": ["14px", { "lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "600" }],
            "label-lg": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
            "headline-lg": ["36px", { "lineHeight": "46px", "letterSpacing": "-0.015em", "fontWeight": "600" }]
          }
        }
      }
    }
  </script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
