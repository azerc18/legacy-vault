<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LegacyVault</title>

  <!-- Logo cú-ổ-khoá: favicon trên tab trình duyệt + icon khi lưu ra màn hình chính -->
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#0b1030" />

  <!-- Font và Icon -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet" />

  <!-- Đặt theme TRƯỚC khi vẽ trang để không bị nháy trắng: lv_theme = light | dark, chưa chọn thì theo hệ điều hành -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('lv_theme');
        var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) { /* localStorage bị chặn: dùng nền sáng */ }
    })();
  </script>

  <!-- Dùng thẳng Tailwind qua CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          borderRadius: { lg: '0.875rem', xl: '1.125rem', '2xl': '1.5rem' },
          boxShadow: { sm: '0 1px 2px rgba(11,16,32,0.06), 0 8px 24px -12px rgba(11,16,32,0.18)' },
          // Màu lấy từ biến CSS (src/index.css): :root = nền sáng, html.dark = nền tối
          colors: {
            "primary": "rgb(var(--c-primary) / <alpha-value>)",
            "on-primary": "rgb(var(--c-on-primary) / <alpha-value>)",
            "primary-container": "rgb(var(--c-primary-container) / <alpha-value>)",
            "secondary": "rgb(var(--c-secondary) / <alpha-value>)",
            "on-secondary": "rgb(var(--c-on-secondary) / <alpha-value>)",
            "background": "rgb(var(--c-background) / <alpha-value>)",
            "on-surface": "rgb(var(--c-on-surface) / <alpha-value>)",
            "on-surface-variant": "rgb(var(--c-on-surface-variant) / <alpha-value>)",
            "surface-container-lowest": "rgb(var(--c-surface-container-lowest) / <alpha-value>)",
            "surface-container-low": "rgb(var(--c-surface-container-low) / <alpha-value>)",
            "surface-container": "rgb(var(--c-surface-container) / <alpha-value>)",
            "surface-container-high": "rgb(var(--c-surface-container-high) / <alpha-value>)",
            "outline": "rgb(var(--c-outline) / <alpha-value>)",
            "outline-variant": "rgb(var(--c-outline-variant) / <alpha-value>)",
            "secondary-fixed": "rgb(var(--c-secondary-fixed) / <alpha-value>)",
            "on-secondary-fixed": "rgb(var(--c-on-secondary-fixed) / <alpha-value>)",
            "tertiary-fixed": "rgb(var(--c-tertiary-fixed) / <alpha-value>)",
            "tertiary-container": "rgb(var(--c-tertiary-container) / <alpha-value>)",
            "primary-fixed": "rgb(var(--c-primary-fixed) / <alpha-value>)",
            "on-primary-fixed": "rgb(var(--c-on-primary-fixed) / <alpha-value>)",
            "error": "rgb(var(--c-error) / <alpha-value>)",
            "on-error": "rgb(var(--c-on-error) / <alpha-value>)",
            "error-container": "rgb(var(--c-error-container) / <alpha-value>)",
            "on-error-container": "rgb(var(--c-on-error-container) / <alpha-value>)",
            "success": "rgb(var(--c-success) / <alpha-value>)",
            "on-success": "rgb(var(--c-on-success) / <alpha-value>)",
            "success-container": "rgb(var(--c-success-container) / <alpha-value>)",
            "on-success-container": "rgb(var(--c-on-success-container) / <alpha-value>)",
            "warning": "rgb(var(--c-warning) / <alpha-value>)",
            "on-warning": "rgb(var(--c-on-warning) / <alpha-value>)",
            "warning-container": "rgb(var(--c-warning-container) / <alpha-value>)",
            "on-warning-container": "rgb(var(--c-on-warning-container) / <alpha-value>)",
            "brand": "rgb(var(--c-brand) / <alpha-value>)",
            "brand-container": "rgb(var(--c-brand-container) / <alpha-value>)",
            "surface": "rgb(var(--c-surface) / <alpha-value>)",
            "secondary-container": "rgb(var(--c-secondary-container) / <alpha-value>)",
            "on-secondary-container": "rgb(var(--c-on-secondary-container) / <alpha-value>)",
            "on-primary-container": "rgb(var(--c-on-primary-container) / <alpha-value>)",
            "on-tertiary-container": "rgb(var(--c-on-tertiary-container) / <alpha-value>)"
          },
          spacing: {
            "margin": "1.25rem",
            "space-xs": "0.375rem",
            "space-xl": "3rem",
            "gutter-lg": "2rem",
            "margin-lg": "4rem",
            "space-lg": "2rem",
            "space-md": "1.25rem",
            "gutter": "1.5rem",
            "margin-md": "2.5rem",
            "space-sm": "0.75rem"
          },
          fontFamily: {
            "body-md": ["Atkinson Hyperlegible Next"],
            "body-xl": ["Atkinson Hyperlegible Next"],
            "body-lg": ["Atkinson Hyperlegible Next"],
            "label-md": ["Atkinson Hyperlegible Next"],
            "label-sm": ["Atkinson Hyperlegible Next"],
            "label-lg": ["Atkinson Hyperlegible Next"],
            "headline-sm": ["Plus Jakarta Sans"],
            "headline-md": ["Plus Jakarta Sans"],
            "headline-lg": ["Plus Jakarta Sans"],
            "title-lg": ["Plus Jakarta Sans"]
          },
          fontSize: {
            "headline-sm": ["22px", { "lineHeight": "30px", "fontWeight": "600" }],
            "body-md": ["16px", { "lineHeight": "26px", "fontWeight": "400" }],
            "body-xl": ["20px", { "lineHeight": "32px", "fontWeight": "400" }],
            "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
            "label-md": ["16px", { "lineHeight": "22px", "fontWeight": "600" }],
            "headline-md": ["26px", { "lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
            "label-sm": ["14px", { "lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "600" }],
            "label-lg": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
            "title-lg": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
            "headline-lg": ["36px", { "lineHeight": "46px", "letterSpacing": "-0.015em", "fontWeight": "600" }]
          }
        }
      }
    }
  </script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
