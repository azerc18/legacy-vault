mail.dmsReminder.p1=You have not checked in to your Dead Man's Switch on LegacyVault.\nCheck-in deadline: {0} (Vietnam time)\nIf you do not respond, the system will start the handover process at {1} (Vietnam time) and notify your Digital Executor.
