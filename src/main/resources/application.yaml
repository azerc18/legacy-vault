server:
  port: 8084

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  application:
    name: legacy-vault
    properties:
      logging.level.org.springframework.security=DEBUG
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${MYSQL_DATABASE:legacy_vault}
    username: ${MYSQL_USER:legacy_vault_user}
    password: ${MYSQL_PASSWORD:legacyvault_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: "20261101.0900"
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
    refresh-token-ttl-seconds: ${JWT_REFRESH_TOKEN_TTL_SECONDS:604800}
    cookie-secure: ${JWT_COOKIE_SECURE:false}

app:
  verification:
    bank:
      # Độ dài số tài khoản hợp lệ theo ngân hàng, dùng cho cách xác thực BANK_FORMAT_CHECK (chỉ kiểm định dạng).
      # Khóa = tên ngân hàng viết thường, không dấu, không khoảng trắng; có thể thêm tên gọi tắt thành khóa riêng.
      # Mỗi dòng chỉ lấy từ trang CHÍNH THỨC của chính ngân hàng đó (đã đọc ngày 09/11/2026), KHÔNG điền theo trí nhớ
      # và KHÔNG lấy từ bài của ngân hàng khác viết về ngân hàng này. Ngân hàng không có ở đây thì
      # BANK_FORMAT_CHECK không dùng được cho ngân hàng đó (và bị ẩn hẳn nếu cả bảng trống). Muốn thêm: thêm một khóa
      # kèm trích dẫn nguồn chính thức ngay dưới đây.
      account-lengths:
        # BIDV: thông báo "Thông báo dừng sử dụng tài khoản 14 số tại BIDV" (bidv.com.vn, đăng 01/06/2025, nhắc lại thông báo
        # 10/07/2024): bắt buộc dùng "tài khoản rút gọn (tài khoản có độ dài từ 3-8 và 10 số)" thay cho tài khoản 14 số;
        # từ 15/07/2025 giao dịch tới/đi tài khoản 14 số bị gián đoạn nên KHÔNG đưa 14 vào bảng.
        # (Trang "Tài khoản Như ý" của BIDV ghi chung "từ 3 đến 10 chữ số" nhưng không nêu 9; giữ theo thông báo.)
        bidv: [3, 4, 5, 6, 7, 8, 10]
        # Techcombank: bài "Số tài khoản ngân hàng là gì?" (techcombank.com/thong-tin/blog/so-tai-khoan-ngan-hang, bản 05/11/2026):
        # "thường có độ dài 14 ký tự"; chương trình số đẹp "tự chọn bộ số có độ dài từ 6 - 14 ký tự"
        # (tất cả khách hàng 10 - 12 - 14 ký tự, khách hàng ưu tiên 6 - 9 ký tự).
        techcombank: [6, 7, 8, 9, 10, 11, 12, 13, 14]
        tcb: [6, 7, 8, 9, 10, 11, 12, 13, 14]
        # MB: bài "Số tài khoản ngân hàng là gì?" (mbbank.com.vn/tin-tuc/tin-san-pham-dich-vu/so-tai-khoan-ngan-hang-la-gi,
        # đăng 01/10/2022): "Đối với MB, số tài khoản ngân hàng sẽ có từ 9 - 13 số."
        mbbank: [9, 10, 11, 12, 13]
        mb: [9, 10, 11, 12, 13]
        # CHƯA xác nhận được từ nguồn chính thức nên CHƯA điền (xem PR): Vietcombank, VietinBank (trang số đẹp chỉ nêu 4-12 ký tự),
        # Agribank, ACB, Sacombank, VPBank, TPBank, HDBank, VIB, MSB, SeABank, SHB, OCB, LPBank, Eximbank.
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173
  # Địa chỉ frontend (Vite, cổng 5173), dùng để tạo link trong email. BẮT BUỘC đặt FRONTEND_BASE_URL=https://... khi deploy, nếu không mail sẽ chứa link localhost.
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  storage:
    # Thư mục lưu file upload. Khi deploy production, override bằng biến môi trường:
    # APP_STORAGE_UPLOAD_DIR=/data/legacyvault/uploads
    upload-dir: ${APP_STORAGE_UPLOAD_DIR:uploads/}
    # H1: local (mặc định, ghi vào upload-dir) | s3 (MinIO / Cloudflare R2 / AWS S3). File luôn được mã hóa trước khi lưu.
    provider: ${APP_STORAGE_PROVIDER:local}
    # Chạy một lần khi khởi động: đưa file cũ trong upload-dir lên bucket và đổi đường dẫn trong DB sang key.
    migrate-local: ${APP_STORAGE_MIGRATE_LOCAL:false}
    s3:
      # MinIO: http://localhost:9000 · R2: https://<account_id>.r2.cloudflarestorage.com · AWS S3: để trống
      endpoint: ${S3_ENDPOINT:}
      # R2 dùng "auto"
      region: ${S3_REGION:us-east-1}
      bucket: ${S3_BUCKET:legacyvault}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      path-style: ${S3_PATH_STYLE:true}
  claim:
    # BR-04: số ngày Beneficiary có để nhận tài sản, tính từ lúc Vault UNLOCKED
    timeout-days: ${CLAIM_TIMEOUT_DAYS:60}
  security:
    crypto:
      master-key: ${CRYPTO_MASTER_KEY}
    # #19: khóa HMAC băm OTP (Base64, >= 32 byte). Để trống: suy ra từ CRYPTO_MASTER_KEY
    otp-hmac-key: ${OTP_HMAC_KEY:}
  vnpay:
    # Lấy từ cổng merchant VNPay; để trống khi chưa tích hợp. KHÔNG commit giá trị thật.
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    # URL BACKEND (/api/payments/vnpay-return) mà VNPay redirect trình duyệt về sau thanh toán (vnp_ReturnUrl).
    # Phải truy cập được từ trình duyệt người dùng; production đặt VNPAY_RETURN_URL theo domain thật.
    return-url: ${VNPAY_RETURN_URL:http://localhost:8084/api/payments/vnpay-return}
    # false: chỉ IPN (server-to-server, có chữ ký) mới kích hoạt gói; return-url chỉ để hiển thị kết quả
    activate-on-return: false
    # API querydr dùng để đối soát đơn PENDING; trống thì suy ra từ pay-url (sandbox -> API sandbox)
    api-url: ${VNPAY_API_URL:}
  payment:
    reconcile:
      # Job đóng đơn PENDING quá hạn, hỏi lại VNPay/PayPal trước khi đóng (PendingPaymentReconciler)
      enabled: ${PAYMENT_RECONCILE_ENABLED:true}
      pending-timeout: PT30M
      give-up-after: PT24H
      interval: PT10M
  paypal:
    # Lấy từ developer.paypal.com; để trống thì cổng PayPal tự ẩn. KHÔNG commit giá trị thật.
    client-id: ${PAYPAL_CLIENT_ID:}
    secret: ${PAYPAL_SECRET:}
    base-url: ${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
    # PayPal không nhận VND: quy sang USD theo tỷ giá cố định này
    vnd-per-usd: ${PAYPAL_VND_PER_USD:25400}
  google:
    # OAuth Client ID (Google Cloud Console > Credentials > Web application). Để trống = ẩn nút Google.
    client-id: ${GOOGLE_CLIENT_ID:}
  ai:
    provider: ${AI_PROVIDER:mock}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.6-flash}
    ocr:
      # Chỉ bật khi trình diễn: tên file chứa từ khoá (mismatch, blur, cccd...) sẽ trả kết quả MÔ PHỎNG (engineSource=DEMO_SIMULATION).
      demo-scenarios: ${AI_OCR_DEMO_SCENARIOS:false}
  demo:
    # Chỉ bật trong buổi demo: Admin có nút "Simulate overdue" giả Owner quá hạn check-in (POST /api/admin/demo/...).
    # Tắt (mặc định) thì nút ẩn và API trả 404. KHÔNG bật lâu dài trên production.
    tools-enabled: ${APP_DEMO_TOOLS_ENABLED:false}

