server:
  port: 8084

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  application:
    name: legacy-vault
    properties:
      logging.level.org.springframework.security=DEBUG
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${MYSQL_DATABASE:legacy_vault}
    username: ${MYSQL_USER:legacy_vault_user}
    password: ${MYSQL_PASSWORD:legacyvault_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: "20261101.0900"
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
    refresh-token-ttl-seconds: ${JWT_REFRESH_TOKEN_TTL_SECONDS:604800}
    cookie-secure: ${JWT_COOKIE_SECURE:false}

app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173
  # Địa chỉ frontend (Vite, cổng 5173), dùng để tạo link trong email. BẮT BUỘC đặt FRONTEND_BASE_URL=https://... khi deploy, nếu không mail sẽ chứa link localhost.
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  storage:
    # Thư mục lưu file upload. Khi deploy production, override bằng biến môi trường:
    # APP_STORAGE_UPLOAD_DIR=/data/legacyvault/uploads
    upload-dir: ${APP_STORAGE_UPLOAD_DIR:uploads/}
    # H1: local (mặc định, ghi vào upload-dir) | s3 (MinIO / Cloudflare R2 / AWS S3). File luôn được mã hóa trước khi lưu.
    provider: ${APP_STORAGE_PROVIDER:local}
    # Chạy một lần khi khởi động: đưa file cũ trong upload-dir lên bucket và đổi đường dẫn trong DB sang key.
    migrate-local: ${APP_STORAGE_MIGRATE_LOCAL:false}
    s3:
      # MinIO: http://localhost:9000 · R2: https://<account_id>.r2.cloudflarestorage.com · AWS S3: để trống
      endpoint: ${S3_ENDPOINT:}
      # R2 dùng "auto"
      region: ${S3_REGION:us-east-1}
      bucket: ${S3_BUCKET:legacyvault}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      path-style: ${S3_PATH_STYLE:true}
  security:
    crypto:
      master-key: ${CRYPTO_MASTER_KEY}
  ai:
    provider: ${AI_PROVIDER:mock}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.6-flash}

