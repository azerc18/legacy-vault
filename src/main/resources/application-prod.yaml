spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${MYSQL_DATABASE}?sslMode=REQUIRED&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

security:
  jwt:
    cookie-secure: true

app:
  rate-limit:
    # Azure App Service đứng trước app và tự thêm IP người dùng vào cuối X-Forwarded-For
    trust-forwarded-for: ${APP_RATE_LIMIT_TRUST_FORWARDED_FOR:true}
