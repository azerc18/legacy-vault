name: Deploy

# Chạy sau khi Java CI xanh trên main, hoặc bấm tay (Run workflow) để deploy lại / rollback một commit.
on:
  workflow_run:
    workflows: ["Java CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA hoặc nhánh cần deploy (mặc định: main)"
        required: false
        default: main

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: deploy-azure
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/azerc18/legacy-vault
  RESOURCE_GROUP: rg-legacyvault
  WEBAPP: legacyvault-luctieulinhdong
  HEALTH_URL: https://legacyvault.codes/actuator/health

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: legacy-vault
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref }}

      - name: Resolve commit
        id: meta
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Switch Web App to new image
        run: |
          az webapp config container set -g "$RESOURCE_GROUP" -n "$WEBAPP" \
            --container-image-name "$IMAGE:${{ steps.meta.outputs.sha }}" \
            --container-registry-url https://ghcr.io -o none

      # App khởi động ~2–6 phút. Container cũ còn phục vụ trong lúc chờ, nên đợi trước rồi mới kiểm;
      # nếu container mới lỗi, App Service dừng site và health sẽ không UP.
      - name: Wait for health
        run: |
          sleep 300
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 20 "$HEALTH_URL" | grep -q '"status":"UP"'; then
              echo "UP"; exit 0
            fi
            sleep 20
          done
          echo "App did not become healthy, check Log stream on Azure"; exit 1
