services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-legacy_vault}
      MYSQL_USER: ${MYSQL_USER:-legacy_vault_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-legacyvault_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - legacyvault_mysql:/var/lib/mysql

  # H1: object storage tương thích S3 cho môi trường phát triển (APP_STORAGE_PROVIDER=s3).
  # API: http://localhost:9000 · Console: http://localhost:9001 (đăng nhập bằng MINIO_ROOT_USER / MINIO_ROOT_PASSWORD).
  # Bucket do ứng dụng tự tạo khi khởi động.
  # Docker Hub đã gỡ image minio/minio; dùng bản đóng gói đã đóng băng của Bitnami, chỉ cho môi trường phát triển.
  minio:
    image: bitnamilegacy/minio:2025.4.22
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-legacyvault}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-legacyvault-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - legacyvault_minio:/bitnami/minio/data

volumes:
  legacyvault_mysql:
  legacyvault_minio: